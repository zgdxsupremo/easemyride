<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — 24x7 Helpline & Support — MargDrive</title>
  <meta name="description" content="Get in touch with MargDrive for 24/7 cab bookings, driver coordination, enterprise inquiries, and trip assistance.">
  <link rel="canonical" href="https://MargDrive.com/contact.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="container" style="padding: 4rem 1.5rem 5rem;">
    <div class="section-header">
      <div class="hero-badge">24x7 Customer Support</div>
      <h1 class="section-title">We're Here To Help You</h1>
      <p class="section-subtitle">Reach out to our operations and dispatch team directly for immediate assistance.</p>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:2rem; max-width:960px; margin:0 auto;">
      <!-- Direct Contact Card -->
      <div style="background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-xl); padding:2rem; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:1.5rem;">
        <h3 style="color:var(--secondary); font-size:1.3rem;">Direct Channels</h3>

        <div style="display:flex; gap:1rem; align-items:flex-start;">
          <div style="width:44px; height:44px; border-radius:50%; background:var(--primary-subtle); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            📞
          </div>
          <div>
            <div style="font-size:0.8rem; color:var(--gray-500); text-transform:uppercase; font-weight:700;">24/7 Helpline Phone</div>
            <a href="tel:+919876543210" style="font-size:1.15rem; font-weight:700; color:var(--secondary);">+91 79737 85807</a>
          </div>
        </div>

        <div style="display:flex; gap:1rem; align-items:flex-start;">
          <div style="width:44px; height:44px; border-radius:50%; background:#DCFCE7; color:#15803D; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            💬
          </div>
          <div>
            <div style="font-size:0.8rem; color:var(--gray-500); text-transform:uppercase; font-weight:700;">WhatsApp Support</div>
            <a href="https://wa.me/919876543210" target="_blank" style="font-size:1.15rem; font-weight:700; color:var(--primary);">Chat on WhatsApp</a>
          </div>
        </div>

        <div style="display:flex; gap:1rem; align-items:flex-start;">
          <div style="width:44px; height:44px; border-radius:50%; background:var(--info-subtle); color:var(--info); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            ✉️
          </div>
          <div>
            <div style="font-size:0.8rem; color:var(--gray-500); text-transform:uppercase; font-weight:700;">Support Email</div>
            <a href="mailto:support@MargDrive.com" style="font-size:1.05rem; font-weight:600; color:var(--secondary);">support@MargDrive.com</a>
          </div>
        </div>
      </div>

      <!-- Quick Message Form -->
      <div style="background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius-xl); padding:2rem; box-shadow:var(--shadow-sm);">
        <h3 style="color:var(--secondary); font-size:1.3rem; margin-bottom:1rem;">Send Us a Message</h3>
        
        <form id="contact-support-form" class="search-form">
          <div class="form-group">
            <label for="c-name">Your Name</label>
            <input type="text" id="c-name" class="form-control" placeholder="Rahul Sharma" required>
          </div>
          <div class="form-group">
            <label for="c-phone">Phone Number</label>
            <input type="tel" id="c-phone" class="form-control" placeholder="10-digit Phone" maxlength="10" required>
          </div>
          <div class="form-group">
            <label for="c-message">Message / Trip Inquiry</label>
            <textarea id="c-message" class="form-control" rows="3" placeholder="How can we assist you today?" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Send Message</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UI.injectNavigation("contact");
      const form = document.getElementById("contact-support-form");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          UI.showToast("Message Received", "Thank you! Our support coordinator will get back to you shortly.", "success");
          form.reset();
        });
      }
    });
  </script>
</body>
</html>
